    *{margin:0;padding:0;box-sizing:border-box}

    /* SIDEBAR */

    .sb-divider{width:1.6rem;height:1px;background:rgba(253,246,236,0.1);margin:0.4rem 0}
    .sb-btn{width:3rem;height:3rem;border-radius:0.85rem;border:none;background:transparent;color:rgba(253,246,236,0.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.15rem;cursor:pointer;transition:all 160ms ease;position:relative}

    .sb-btn.active{background:rgba(253,246,236,0.1);color:var(--cream)}
    .sb-btn.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:1.4rem;border-radius:0 3px 3px 0;background:var(--pink-hot);box-shadow:0 0 8px rgba(232,84,107,0.5)}
    .sb-btn .material-symbols-outlined{font-size:1.2rem}
    .sb-btn .sb-label{font-size:0.45rem;font-weight:700;letter-spacing:0.04em;text-transform:uppercase}
    .sb-spacer{flex:1}

    /* MAIN */
    .main-area{flex:1;display:flex;min-width:0}
    .content-panel{flex:1;display:flex;flex-direction:column;min-width:0}
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:0.65rem 1.3rem;flex-shrink:0;background:var(--cream-dark)}
    .topbar-title{font-family:'Fraunces',serif;font-weight:800;font-size:1.15rem;color:var(--maroon)}
    .topbar-right{display:flex;align-items:center;gap:0.5rem}
    .topbar-stat{font-size:0.6rem;font-weight:600;padding:0.25rem 0.6rem;border-radius:9999px;background:var(--burgundy);color:var(--cream);letter-spacing:0.05em;text-transform:uppercase}

    .stage-bars{position:absolute;top:0;left:50%;transform:translateX(-50%);width:calc(100% - 0.8rem);z-index:1;pointer-events:none}
    .stage-bar{height:0.35rem;border-radius:0 0 var(--radius-xl) var(--radius-xl);margin:0 auto}

    .stage-bar:nth-child(3){width:calc(100% - 2rem);background:var(--burgundy)}
    .stage-scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:1.8rem;z-index:2;scrollbar-width:thin;scrollbar-color:var(--pink) transparent}
    .stage-scroll::-webkit-scrollbar{width:5px}
    .stage-scroll::-webkit-scrollbar-track{background:transparent}
    .stage-scroll::-webkit-scrollbar-thumb{background:var(--pink);border-radius:9999px}

    /* PREVIEW */

    .preview-header span:last-child{font-size:0.62rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--burgundy);opacity:0.4}
    .preview-body{flex:1;overflow-y:auto;padding:1rem;scrollbar-width:thin;scrollbar-color:var(--pink-light) transparent}
    .preview-body::-webkit-scrollbar{width:4px}
    .preview-body::-webkit-scrollbar-track{background:transparent}
    .preview-body::-webkit-scrollbar-thumb{background:var(--pink-light);border-radius:9999px}

    .pv-title{font-family:'Fraunces',serif;font-weight:800;font-size:1.15rem;color:var(--maroon-deep)}
    .pv-sub{font-size:0.72rem;color:var(--burgundy);opacity:0.5;margin-top:0.1rem}
    .pv-divider{height:1px;background:rgba(107,29,50,0.06);margin:0.7rem 0}
    .pv-field{display:flex;justify-content:space-between;padding:0.35rem 0;font-size:0.72rem}
    .pv-field-label{color:var(--burgundy);opacity:0.6}
    .pv-field-value{font-weight:600;color:var(--maroon-deep);text-align:right;max-width:55%}
    .pv-section-label{font-size:0.55rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--burgundy);opacity:0.4;margin-top:0.5rem;margin-bottom:0.25rem}
    .pv-text{font-size:0.72rem;line-height:1.55;color:var(--maroon);opacity:0.75}
    .pv-script{font-size:0.7rem;line-height:1.55;color:var(--maroon-deep);background:var(--cream);padding:0.6rem 0.8rem;border-radius:0.6rem;border:1px solid rgba(107,29,50,0.06);margin-top:0.3rem;font-style:italic}
    .pv-tag{padding:0.15rem 0.4rem;border-radius:9999px;font-size:0.55rem;font-weight:600;background:var(--cream);color:var(--burgundy);border:1px solid rgba(107,29,50,0.05);display:inline-block;margin:0.1rem}

    /* VIEW HEADERS */
    .vh{text-align:center;margin-bottom:1.5rem}
    .vh .label{display:inline-flex;align-items:center;gap:0.3rem;padding:0.25rem 0.7rem;border-radius:9999px;background:var(--burgundy);color:var(--cream);font-size:0.58rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase}
    .vh .label .material-symbols-outlined{font-size:0.75rem}
    .vh h2{font-family:'Fraunces',serif;font-weight:900;font-size:2rem;letter-spacing:-0.04em;color:var(--maroon-deep);margin-top:0.6rem}
    .vh p{margin-top:0.3rem;color:var(--burgundy);opacity:0.5;font-size:0.82rem}

    /* HERO */
    .hero-block{background:var(--cream);border-radius:var(--radius-lg);border:2px solid rgba(107,29,50,0.05);box-shadow:var(--shadow-card);padding:1.6rem;margin-bottom:1.2rem;position:relative;overflow:hidden}
    .hero-block::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--pink),var(--rose),var(--burgundy))}
    .hero-eyebrow{display:inline-flex;align-items:center;gap:0.3rem;padding:0.25rem 0.7rem;border-radius:9999px;background:var(--burgundy);color:var(--cream);font-size:0.58rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:0.8rem}
    .hero-title{font-family:'Fraunces',serif;font-weight:900;font-size:clamp(1.6rem,3.5vw,2.4rem);letter-spacing:-0.03em;color:var(--maroon-deep);line-height:1.1;margin-bottom:0.5rem}
    .hero-title-accent{background:linear-gradient(90deg,var(--rose),var(--pink-hot),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .hero-desc{font-size:0.8rem;color:var(--burgundy);opacity:0.6;line-height:1.6}

    /* TIER HEADERS */
    .tier-header{display:flex;align-items:center;gap:0.6rem;margin:1.5rem 0 0.8rem;padding-bottom:0.5rem;border-bottom:2px solid var(--pink-light)}
    .tier-icon{width:2.4rem;height:2.4rem;border-radius:0.7rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .tier-icon .material-symbols-outlined{font-size:1.2rem}
    .tier-info h3{font-family:'Fraunces',serif;font-weight:800;font-size:1.1rem;color:var(--maroon-deep)}
    .tier-info p{font-size:0.68rem;color:var(--burgundy);opacity:0.5}

    /* DOSSIER CARDS */

    .dossier-card:hover{transform:translateY(-1px);box-shadow:var(--shadow-soft);border-color:var(--pink)}
    .dossier-card.tier-fire{border-left:4px solid var(--rose)}
    .dossier-card.tier-whale{border-left:4px solid var(--gold)}
    .dossier-card.tier-giant{border-left:4px solid var(--pink-hot)}
    .dossier-card.tier-radar{border-left:4px solid var(--sky)}
    .dossier-card.tier-intel{border-left:4px solid var(--lavender)}
    .dossier-card.tier-venue{border-left:4px solid var(--mint-dark)}

    .dc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:0.6rem;margin-bottom:0.4rem}
    .dc-name{font-family:'Fraunces',serif;font-weight:800;font-size:1rem;color:var(--maroon-deep)}
    .dc-value{font-family:'Fraunces',serif;font-weight:800;font-size:1.05rem;color:var(--rose);white-space:nowrap}
    .dc-status{font-size:0.68rem;color:var(--burgundy);opacity:0.55;margin-bottom:0.4rem}
    .dc-profile{font-size:0.72rem;color:var(--maroon);opacity:0.7;line-height:1.5;margin-bottom:0.4rem}
    .dc-angle{font-size:0.7rem;line-height:1.5;color:var(--burgundy);opacity:0.75;padding:0.5rem 0.7rem;background:var(--cream-dark);border-radius:0.6rem;border-left:3px solid var(--gold)}
    .dc-tags{display:flex;flex-wrap:wrap;gap:0.2rem;margin-top:0.4rem}
    .dc-tag{padding:0.12rem 0.35rem;border-radius:9999px;font-size:0.5rem;font-weight:600;letter-spacing:0.03em;border:1px solid rgba(107,29,50,0.08);background:var(--cream-dark)}
    .dc-tag.t-urgent{background:rgba(212,64,96,0.1);color:var(--rose);border-color:rgba(212,64,96,0.2)}
    .dc-tag.t-b2b{background:rgba(232,180,76,0.1);color:#8B6914;border-color:rgba(232,180,76,0.2)}
    .dc-tag.t-venue{background:rgba(107,191,150,0.1);color:#2D6B4A;border-color:rgba(107,191,150,0.2)}
    .dc-tag.t-whale{background:rgba(212,64,96,0.06);color:var(--burgundy);border-color:rgba(107,29,50,0.12)}

    /* STATS */
    .stat-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(7rem,1fr));gap:0.4rem;margin-bottom:1rem}
    .stat-box{padding:0.6rem 0.8rem;background:var(--cream);border-radius:var(--radius-md);border:1.5px solid rgba(107,29,50,0.05);box-shadow:var(--shadow-card);text-align:center}
    .stat-num{font-family:'Fraunces',serif;font-weight:900;font-size:1.4rem;line-height:1}
    .stat-lbl{font-size:0.5rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--burgundy);opacity:0.45;margin-top:0.15rem}

    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @media(max-width:1100px){.preview-panel{display:none}}
    @media(max-width:600px){.sidebar{width:3rem}.sb-btn .sb-label{display:none}}
  </style>
</head>

function dossierCard(lead){
  const tierClass={immediate:'tier-fire',whale:'tier-whale',giant:'tier-giant',radar:'tier-radar',newintel:'tier-intel',venue:'tier-venue'}[lead.tier]||'';
  return `<div class="dossier-card ${tierClass}" onmouseenter='showPreview(LEADS[${LEADS.indexOf(lead)}])' onmouseleave="clearPreview()">
    <div class="dc-top"><div class="dc-name">${lead.name}</div><div class="dc-value">${lead.value}</div></div>
    <div class="dc-status">${lead.status}${lead.company?' · '+lead.company:''}${lead.location?' · '+lead.location:''}</div>
    <div class="dc-profile">${lead.profile.substring(0,140)}${lead.profile.length>140?'...':''}</div>
    <div class="dc-angle">${lead.angle.substring(0,160)}${lead.angle.length>160?'...':''}</div>
    <div class="dc-tags">
      <span class="dc-tag ${lead.priority==='urgent'?'t-urgent':lead.priority==='high'?'t-b2b':''}">${lead.priority.toUpperCase()}</span>
      ${lead.company?'<span class="dc-tag t-b2b">B2B</span>':''}
      ${lead.tier==='venue'?'<span class="dc-tag t-venue">VENUE</span>':''}
      ${lead.tags.slice(0,3).map(t=>`<span class="dc-tag">${t}</span>`).join('')}
    </div>
  </div>`;
}

function showView(viewId){
  clearPreview();stageScroll.scrollTop=0;
  document.querySelectorAll('.sb-btn').forEach(b=>b.classList.remove('active'));
  const btn=document.querySelector(`.sb-btn[data-view="${viewId}"]`);if(btn)btn.classList.add('active');
  const r={overview:renderOverview,immediate:renderTier.bind(null,'immediate','local_fire_department','Immediate Conversion','Tasting-stage deals ready to close NOW.','var(--rose)'),whale:renderTier.bind(null,'whale','corporate_fare','Whale B2B Accounts','Completed jobs hiding multi-six-figure B2B pipelines.','var(--gold)'),giant:renderTier.bind(null,'giant','diamond','The Giant','$17K+ deal — highest active pipeline value.','var(--pink-hot)'),newintel:renderTier.bind(null,'newintel','bolt','New Intelligence','Freshly enriched leads with deep OSINT profiles.','var(--lavender)'),venue:renderTier.bind(null,'venue','castle','Venue & B2B Expansion','Completed jobs that unlock venue partnerships and recurring revenue.','var(--mint-dark)')};
  if(r[viewId])r[viewId]();
}
