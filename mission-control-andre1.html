function dealCard(deal,extraClass=''){
  const cls=deal.priority==='urgent'?'urgent':deal.priority==='high'?'high':deal.stage_type==='won'?'won':'';
  const hasRisk=deal.waiting_on_us==='True'||(deal.risk_flags||'').includes('budget_risk');
  const flags=(deal.risk_flags||'').split('|').map(f=>f.trim()).filter(Boolean);
  return `<div class="deal-card ${cls} ${hasRisk?'risk':''} ${extraClass}" onmouseenter='showDealPreview(${JSON.stringify(deal).replace(/'/g,"&#39;")})' onmouseleave="clearPreview()">
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <div class="deal-name">${deal.lead_name}</div>
      ${deal.value?`<span class="deal-value" style="color:var(--rose)">${deal.value}</span>`:''}
    </div>
    <div class="deal-sub">${deal.operator_move||''}</div>
    <div class="deal-tags">
      ${deal.priority==='urgent'?'<span class="tag pri-urgent">URGENT</span>':deal.priority==='high'?'<span class="tag pri-high">HIGH</span>':''}
      ${deal.event_type?`<span class="tag event-tag">${deal.event_type}</span>`:''}
      ${deal.guest_count?`<span class="tag">${deal.guest_count} guests</span>`:''}
      ${deal.stage_type==='won'?'<span class="tag won-tag">WON</span>':''}
      ${deal.waiting_on_us==='True'?'<span class="tag pri-urgent">WAITING ON US</span>':''}
      ${flags.includes('partner_or_family_review')?'<span class="tag risk-tag">Family Review</span>':''}
      ${flags.includes('budget_risk')?'<span class="tag pri-urgent">Budget Risk</span>':''}
    </div>
  </div>`;
}

          <div class="coaching-card"><h4>Tasting Scheduled</h4><p>4 of 30 calls (13.3%) resulted in a tasting booking</p></div>
          <div class="coaching-card"><h4>Quotes Sent</h4><p>10 of 30 calls (33.3%) led to a quote discussion</p></div>
          <div class="coaching-card"><h4>Pricing Objections</h4><p>6 of 30 calls (20%) encountered pricing pushback</p></div>
        </div>
        <div class="panel-block"><h2>Conversation Style</h2>
          <div class="coaching-card"><h4>Strengths</h4><p>Warm, personable openings. Relationship-focused check-ins. Natural rapport building. Appropriate humor. Cultural fluency in both languages.</p></div>
          <div class="coaching-card" style="border-left:3px solid var(--gold)"><h4>Sample: Matt (Meghan Pingeton)</h4><p>"Another day above ground is always a great day." — Building positivity</p></div>
          <div class="coaching-card" style="border-left:3px solid var(--mint-dark)"><h4>Sample: Ana Claudia</h4><p>"Oi, Ana Cláudia, boa noite. Tudo tranquilo." — Natural Portuguese fluency</p></div>
        </div>
      </div>
      <div class="stack">
        <div class="panel-block"><h2>Most Contacted Leads</h2>
          ${topContacts.slice(0,12).map(([name,count])=>`<div style="display:flex;justify-content:space-between;padding:0.35rem 0;border-bottom:1px solid rgba(107,29,50,0.04);font-size:0.75rem"><span style="font-weight:600;color:var(--maroon-deep)">${name.replace(/_/g,' ')}</span><span style="font-weight:700;color:var(--rose)">${count}</span></div>`).join('')}
          <p class="panel-note" style="margin-top:0.5rem">~27% of contacts receive multiple calls — strong relationship nurturing pattern.</p>
        </div>
      </div>
    </div>`;
}

function renderCoaching(){
  const skills=packetRec.skill_development||[];
  const processes=packetRec.process_improvements||[];
  const leading=packetMetrics.leading_indicators||[];
  const lagging=packetMetrics.lagging_indicators||[];
  stageScroll.innerHTML=`
    <div class="vh"><span class="label"><span class="material-symbols-outlined">school</span> Coaching</span><h2>Coaching & Development</h2><p>Data-driven skill gaps and recommended training priorities.</p></div>
    ${skills.map((s,i)=>`<div class="panel-block"><h2>Skill Gap ${i+1}: ${s.skill}</h2><p class="panel-note">${s.gap}</p><div class="coaching-card"><h4>Training Needed</h4><p>${s.training}</p></div></div>`).join('')}
    <div class="panel-block"><h2>Process Improvements</h2>${processes.map(p=>`<div class="coaching-card"><p>${p}</p></div>`).join('')}</div>
    <div class="layout-grid">
      <div class="stack"><div class="panel-block"><h2>Leading Indicators (Weekly)</h2>${leading.map(l=>`<div class="coaching-card"><p>${l}</p></div>`).join('')}</div></div>
      <div class="stack"><div class="panel-block"><h2>Lagging Indicators (Monthly)</h2>${lagging.map(l=>`<div class="coaching-card"><p>${l}</p></div>`).join('')}</div></div>
    </div>
    <div class="panel-block"><h2>Immediate Action Plan</h2>
      ${(packetRec.immediate_actions||[]).map(a=>`<div class="coaching-card" style="border-left:3px solid ${a.priority===1?'var(--rose)':a.priority===2?'var(--gold)':'var(--sky)'}"><h4>Priority ${a.priority}: ${a.action}</h4><p>${a.value_at_stake?`Value at stake: ${a.value_at_stake}. `:''}${a.approach}</p></div>`).join('')}
    </div>`;
}

function renderWins(){
  stageScroll.innerHTML=`
    <div class="vh"><span class="label"><span class="material-symbols-outlined">emoji_events</span> Wins</span><h2>Wins & High-Confidence Pipeline</h2><p>$63,691 locked-in revenue across 10 high-confidence deals.</p></div>
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Locked Revenue</div><div class="stat-value" style="color:var(--mint-dark)">$63.7K</div></div>
      <div class="stat-card"><div class="stat-label">Won Deals</div><div class="stat-value" style="color:var(--gold)">11</div></div>
      <div class="stat-card"><div class="stat-label">Largest Deal</div><div class="stat-value" style="color:var(--rose)">$14.4K</div><div class="stat-foot">Layza / Matheus</div></div>
      <div class="stat-card"><div class="stat-label">Completed</div><div class="stat-value" style="color:var(--burgundy)">1</div><div class="stat-foot">Kassio · $3,114</div></div>
    </div>
    <div class="panel-block"><h2>High-Value Deals ($5,000+)</h2>${highValueDeals.map(d=>dealCard(d)).join('')}</div>
    <div class="panel-block"><h2>All Won Deals</h2>${wins.map(d=>dealCard(d)).join('')}</div>
    <div class="panel-block"><h2>Notable Patterns</h2>
      ${(PACKET.wins_and_successes?.notable_patterns||[]).map(p=>`<div class="coaching-card"><p>${p}</p></div>`).join('')}
    </div>`;
}

showView('dashboard');
