<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Raw AI — redirecionando…</title>
  <!-- This site moved. Canonical + redirect to the new Raw AI site on Vercel. -->
  <link rel="canonical" href="https://raw-ai.vercel.app/" />
  <meta http-equiv="refresh" content="0; url=https://raw-ai.vercel.app/" />
  <meta name="robots" content="noindex, follow" />
  <script>window.location.replace("https://raw-ai.vercel.app/");</script>
  <style>
    html,body{height:100%;margin:0}
    body{
      display:flex;align-items:center;justify-content:center;
      background:#05070d;color:#e9eef7;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      text-align:center;padding:24px;
    }
    .wrap{max-width:420px}
    .logo{font-weight:800;font-size:1.4rem;letter-spacing:-.02em}
    .logo span{background:linear-gradient(115deg,#3ee0ff,#34f5a0);
      -webkit-background-clip:text;background-clip:text;color:transparent}
    p{color:#8b9bb4;margin:.9rem 0 1.4rem;font-size:.95rem}
    a{display:inline-block;padding:.7rem 1.4rem;border-radius:9999px;
      background:linear-gradient(115deg,#3ee0ff,#34f5a0);color:#04121a;
      text-decoration:none;font-weight:700;font-size:.9rem}
    .dot{display:inline-block;width:8px;height:8px;border-radius:50%;
      background:#34f5a0;margin-right:6px;animation:p 1.4s ease-in-out infinite}
    @keyframes p{0%,100%{opacity:1}50%{opacity:.4}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">RAW <span>AI</span></div>
    <p><span class="dot"></span>Nos mudamos! Redirecionando para o novo site…</p>
