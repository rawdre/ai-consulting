<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Protected Proposal for Rodrigo</title>
<meta name="description" content="Protected proposal page for Rodrigo review.">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{
  --bg:#080808;
  --panel:#121212;
  --panel2:#181818;
  --ink:#fff6e8;
  --text:#eadfcd;
  --muted:#b7a58c;
  --gold:#d1a257;
  --gold2:#f0cb93;
  --green:#74d99f;
  --blue:#7cc7ff;
  --line:rgba(209,162,87,.2);
  --line2:rgba(255,255,255,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Manrope',sans-serif;
  background:
    radial-gradient(circle at 16% 0%,rgba(209,162,87,.13),transparent 35%),
    radial-gradient(circle at 86% 6%,rgba(124,199,255,.08),transparent 30%),
    linear-gradient(180deg,#050505 0%,#0b0b0b 48%,#080808 100%);
  color:var(--text);
  min-height:100vh;
  line-height:1.65;
}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:30px 18px 52px}
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  margin-bottom:18px;
}
.brand{
  display:inline-flex;
  align-items:center;
  gap:10px;
  color:var(--gold2);
  text-decoration:none;
  font-size:12px;
  font-weight:800;
  letter-spacing:1.6px;
  text-transform:uppercase;
}
.brand-mark{
  width:12px;
  height:12px;
  border-radius:50%;
  background:var(--gold);
  box-shadow:0 0 24px rgba(209,162,87,.55);
}
.toplinks{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.toplinks a,.print-btn{
  border:1px solid var(--line);
  border-radius:999px;
  padding:9px 13px;
  background:rgba(255,255,255,.03);
  color:var(--muted);
  text-decoration:none;
  font:inherit;
  font-size:12px;
  font-weight:800;
  cursor:pointer;
}
.toplinks a:hover,.print-btn:hover{color:var(--ink);border-color:rgba(209,162,87,.45)}
.hero{
  border:1px solid var(--line);
  border-radius:28px;
  overflow:hidden;
  background:
    linear-gradient(135deg,rgba(209,162,87,.1),rgba(255,255,255,.02) 42%,rgba(124,199,255,.06)),
    var(--panel);
}
.hero-inner{
  display:grid;
  grid-template-columns:minmax(0,1.25fr) minmax(310px,.75fr);
  gap:20px;
  padding:36px;
}
.badge{
  display:inline-flex;
  align-items:center;
  width:max-content;
  border:1px solid var(--line);
  border-radius:999px;
  padding:8px 12px;
  background:rgba(209,162,87,.1);
  color:var(--gold2);
  font-size:11px;
  font-weight:800;
  letter-spacing:1.4px;
  text-transform:uppercase;
}
h1,h2,h3{font-family:'Cormorant Garamond',serif;color:var(--ink);font-weight:700}
h1{font-size:clamp(44px,7vw,82px);line-height:.88;margin:18px 0 18px;max-width:850px}
h2{font-size:clamp(34px,4.6vw,54px);line-height:1;margin-bottom:14px}
h3{font-size:30px;line-height:1.05;margin-bottom:8px}
.lead{max-width:780px;color:#ddccb3;font-size:18px}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border-radius:999px;
  padding:13px 17px;
  text-decoration:none;
  font-weight:900;
  font-size:13px;
  border:1px solid var(--line);
}
.btn-primary{background:var(--gold);color:#16100a;border-color:var(--gold)}
.btn-secondary{background:rgba(255,255,255,.03);color:var(--gold2)}
.summary-card{
  align-self:stretch;
  background:rgba(0,0,0,.22);
  border:1px solid var(--line);
  border-radius:22px;
  padding:20px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  min-height:100%;
}
.summary-card p{color:var(--muted);font-size:14px;margin:10px 0 16px}
.quick-list{display:grid;gap:10px}
.quick-item{
  display:grid;
  grid-template-columns:auto 1fr;
  gap:10px;
  align-items:flex-start;
  padding:12px;
  border:1px solid var(--line2);
  border-radius:16px;
  background:rgba(255,255,255,.03);
}
.check{
  width:22px;
  height:22px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:rgba(116,217,159,.16);
  color:var(--green);
  font-weight:900;
  font-size:12px;
}
.quick-item strong{display:block;color:var(--ink);font-size:14px;line-height:1.3}
.quick-item span{display:block;color:var(--muted);font-size:12px;margin-top:2px;line-height:1.45}
.section{padding:28px 0 0}
.section-shell{
  border:1px solid var(--line);
  border-radius:28px;
  background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,.01));
  padding:26px;
}
.section-head{
  display:flex;
  justify-content:space-between;
  gap:18px;
  align-items:flex-end;
  margin-bottom:18px;
}
.section-head p{max-width:620px;color:var(--muted)}
.pill-row{display:flex;gap:8px;flex-wrap:wrap}
.pill{
  display:inline-flex;
  align-items:center;
  border:1px solid var(--line);
  border-radius:999px;
  padding:7px 11px;
  color:var(--gold2);
  background:rgba(209,162,87,.08);
  font-size:11px;
  font-weight:900;
  letter-spacing:.8px;
  text-transform:uppercase;
}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.card{
  border:1px solid var(--line);
  border-radius:22px;
  background:var(--panel2);
  padding:19px;
}
.card strong,.money{color:var(--ink)}
.card p{color:var(--muted);font-size:14px}
.metric{
  font-size:34px;
  line-height:1;
  font-weight:900;
  color:var(--gold2);
  margin:12px 0 8px;
}
.metric span{font-size:14px;color:var(--muted);font-weight:700}
.terms{display:grid;gap:10px;margin-top:14px}
.term{
  display:grid;
  grid-template-columns:170px 1fr;
  gap:14px;
  padding:13px 14px;
  border:1px solid var(--line2);
  border-radius:16px;
  background:rgba(255,255,255,.025);
}
.term b{color:var(--gold2);font-size:13px;text-transform:uppercase;letter-spacing:.7px}
.term span{color:var(--text);font-size:14px}
.note{
  margin-top:14px;
  padding:14px 16px;
  border:1px solid rgba(124,199,255,.22);
  border-radius:18px;
  background:rgba(124,199,255,.07);
  color:#cdeaff;
  font-size:14px;
}
.ask-list{display:grid;gap:12px}
.ask{
  padding:18px;
  border:1px solid var(--line);
  border-radius:20px;
  background:rgba(255,255,255,.03);
}
.ask h3{font-size:28px}
.ask p{color:var(--muted);font-size:14px}
ul.clean{list-style:none;display:grid;gap:9px;margin-top:12px}
ul.clean li{
  position:relative;
  padding-left:18px;
  color:var(--muted);
  font-size:14px;
}
ul.clean li:before{
  content:"";
  position:absolute;
  left:0;
  top:.75em;
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--gold);
}
.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.month{
  border:1px solid var(--line2);
  border-radius:18px;
  padding:14px;
  background:rgba(255,255,255,.025);
}
.month b{display:block;color:var(--ink);font-size:13px;margin-bottom:5px}
.month span{display:block;color:var(--gold2);font-weight:900;font-size:22px}
.closing{
  border:1px solid rgba(116,217,159,.26);
  border-radius:28px;
  background:linear-gradient(135deg,rgba(116,217,159,.1),rgba(255,255,255,.02));
  padding:28px;
  margin-top:28px;
}
.closing p{color:#d9f5e2;max-width:860px}
.signature{margin-top:20px;color:var(--ink);font-weight:900}
.income-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.income-table{width:100%;border-collapse:collapse;overflow:hidden;border-radius:18px;border:1px solid var(--line)}
.income-table th,.income-table td{padding:13px 14px;border-bottom:1px solid var(--line2);text-align:left;font-size:14px}
.income-table th{color:var(--gold2);font-size:12px;letter-spacing:.8px;text-transform:uppercase;background:rgba(209,162,87,.08)}
.income-table td{color:var(--text);background:rgba(255,255,255,.025)}
.income-table tr:last-child td{border-bottom:none}
.income-table .total td{color:var(--ink);font-weight:900;background:rgba(116,217,159,.08)}
.goal-box{
  border:1px solid rgba(116,217,159,.26);
  border-radius:22px;
  padding:20px;
  background:rgba(116,217,159,.07);
}
.goal-box h3{color:#e6fff0}
.goal-box p{color:#d9f5e2;font-size:14px}
.goal-number{font-size:42px;line-height:1;font-weight:900;color:var(--green);margin:14px 0 10px}
.footer{
  display:flex;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
  margin-top:22px;
  color:var(--muted);
  font-size:12px;
}
@media (max-width:900px){
  .hero-inner,.grid-3,.grid-2,.timeline,.income-grid{grid-template-columns:1fr}
  .section-head{display:block}
  .pill-row{margin-top:12px}
  .term{grid-template-columns:1fr;gap:4px}
  .topbar{align-items:flex-start;flex-direction:column}
  .toplinks{justify-content:flex-start}
}
@media print{
  body{background:#fff;color:#111}
  .topbar,.hero-actions,.footer{display:none}
  .wrap{max-width:none;padding:0}
  .hero,.section-shell,.card,.ask,.closing,.summary-card,.term,.month{border-color:#ddd;background:#fff;color:#111;box-shadow:none}
  h1,h2,h3,.money,.metric,.summary-card strong,.quick-item strong,.term span,.signature,.goal-number{color:#111}
  .lead,.card p,.section-head p,.ask p,ul.clean li,.term b,.quick-item span,.summary-card p,.month b{color:#444}
  .badge,.pill{border-color:#ddd;color:#333;background:#f8f8f8}
}

body.locked{display:grid;min-height:100vh;place-items:center;padding:26px 16px}
.lock-screen{width:min(620px,100%);border:1px solid var(--line);border-radius:28px;background:linear-gradient(135deg,rgba(209,162,87,.1),rgba(255,255,255,.025));box-shadow:0 24px 80px rgba(0,0,0,.36);padding:28px}
.lock-card{border:1px solid var(--line2);border-radius:22px;background:rgba(0,0,0,.22);padding:22px}
.lock-title{font-size:clamp(36px,8vw,58px);line-height:.95;margin:14px 0 12px}
.lock-copy{color:var(--muted);font-size:15px;margin-bottom:18px}
.lock-form{display:grid;gap:12px;margin-top:18px}
.lock-label{color:var(--gold2);font-size:12px;font-weight:900;letter-spacing:.8px;text-transform:uppercase}
.lock-input{width:100%;border:1px solid var(--line);border-radius:14px;background:#0d0d0d;color:var(--ink);font:inherit;font-size:18px;padding:14px 15px;outline:none}
.lock-input:focus{border-color:rgba(209,162,87,.62);box-shadow:0 0 0 3px rgba(209,162,87,.12)}
.lock-submit{border:0;border-radius:999px;background:var(--gold);color:#16100a;font:inherit;font-weight:900;padding:13px 18px;cursor:pointer}
.lock-submit:disabled{opacity:.65;cursor:wait}
.lock-message{min-height:22px;color:#f0cb93;font-size:13px;font-weight:700}
.lock-message.error{color:#ff8b8b}
.lock-note{margin-top:14px;color:var(--muted);font-size:12px;line-height:1.6}
</style>
</head>

    const textEncoder = new TextEncoder();
    const textDecoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
      return bytes;
    }

    async function decryptProposal(password) {
      if (!window.crypto || !crypto.subtle) throw new Error('This browser does not support secure in-browser decryption.');
      const salt = base64ToBytes(encryptedProposalPayload.salt);
      const iv = base64ToBytes(encryptedProposalPayload.iv);
      const data = base64ToBytes(encryptedProposalPayload.data);
      const keyMaterial = await crypto.subtle.importKey('raw', textEncoder.encode(password), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt, iterations: encryptedProposalPayload.iterations, hash: 'SHA-256' },
        keyMaterial,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );
      const clearBuffer = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
      return textDecoder.decode(clearBuffer);
    }

    document.getElementById('unlockForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const input = document.getElementById('proposalPassword');
      const button = document.getElementById('unlockButton');
      const message = document.getElementById('unlockMessage');
      message.className = 'lock-message';
      message.textContent = 'Checking password...';
      button.disabled = true;
      try {
        const unlockedHtml = await decryptProposal(input.value);
        document.body.classList.remove('locked');
        document.body.innerHTML = unlockedHtml;
        window.scrollTo(0, 0);
      } catch (error) {
        message.className = 'lock-message error';
        message.textContent = 'Incorrect password. Please try again.';
        button.disabled = false;
        input.select();
      }
    });
  </script>
