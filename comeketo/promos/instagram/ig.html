<style>

html,body{background:#000}
.art{position:relative;width:1080px;overflow:hidden;font-family:'Poppins',sans-serif;color:#fff;

.c{position:relative;z-index:3;text-align:center}

.kick{font-family:'Pinyon Script',cursive;font-size:64px;color:var(--lime);margin-top:44px;line-height:1}
h1{font-family:'Fraunces',serif;font-variation-settings:"SOFT" 100,"WONK" 1,"opsz" 144;font-weight:900;font-size:92px;line-height:1;letter-spacing:-1px;margin-top:6px}

.ticket .m{padding:30px 34px 30px 44px;border-right:3px dashed rgba(168,129,42,.5);position:relative}
.ticket .m:before{content:'';position:absolute;left:0;top:0;bottom:0;width:12px;background:var(--lime)}

.ticket .st img{width:76px;height:76px}
.ticket .st img.r{border-radius:50%}
.ribbon{position:absolute;z-index:4;left:50%;margin-left:-330px;background:var(--red);color:#fff;font-weight:800;letter-spacing:2.5px;text-transform:uppercase;font-size:20px;padding:10px 20px;border-radius:10px;transform:rotate(-5deg);box-shadow:0 10px 24px rgba(0,0,0,.4)}
.deal{font-size:36px;line-height:1.35;color:#efe6d6;max-width:900px;margin:46px auto 0;font-weight:500}
.deal b{color:#fff;font-weight:700}
.deal em{font-style:normal;color:var(--gold);font-weight:700}
.bar{position:absolute;left:0;right:0;bottom:0;z-index:3;height:150px;background:var(--lime);display:flex;align-items:center;justify-content:space-between;padding:0 64px;color:#14170a;overflow:hidden}
.bar:before{content:'';position:absolute;left:-60px;top:0;bottom:0;width:420px;background:#0e0d0c;transform:skewX(-34deg);transform-origin:bottom}
.bar .l{position:relative;font-family:'Pinyon Script',cursive;font-size:62px;color:var(--gold-soft)}
.bar .r{position:relative;text-align:right;font-weight:800;font-size:30px;line-height:1.2}
.bar .r small{display:block;font-weight:600;font-size:22px}
.vanwrap{position:absolute;left:-40px;right:-40px;z-index:2}
.story .vanwrap{bottom:150px}
.story .lock{padding-top:170px}
.story .ticket{margin-top:40px}
.story .deal{margin-top:42px}
.van-drive{animation:drive 2.2s cubic-bezier(.2,.8,.2,1) both}

.ribbon{top:-14px}

var seed=7;function rnd(){seed=(seed*16807)%2147483647;return(seed-1)/2147483646;}
var F=[];for(var i=0;i<140;i++)F.push({x:rnd()*1080,y:rnd()*H,r:rnd()*3.2+1,s:rnd()*60+40,d:rnd()*6.28});
function snow(sec){ctx.clearRect(0,0,1080,H);ctx.fillStyle='rgba(255,255,255,.75)';F.forEach(function(f){var y=(f.y+f.s*sec)%(H+10),x=f.x+Math.sin(f.d+sec*1.2)*14;ctx.beginPath();ctx.arc(x,y,f.r,0,6.283);ctx.fill();});}
var amt=document.getElementById('amt');
window.renderAt=function(sec){
  document.getAnimations().forEach(function(a){a.pause();a.currentTime=sec*1000;});
  snow(sec);
  var k=Math.max(0,Math.min(1,(sec-.7)/1.3));amt.textContent=Math.round(250*(1-Math.pow(1-k,4)));
};
window.renderStill=function(){window.renderAt(6);};
if(!q.get('frames'))window.renderStill();
</script></body></html>
